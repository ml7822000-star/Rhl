name: Build Android Cloud Demo

on:
  push:
    branches:
      - claude/android-cloud-build-demo
    paths:
      - 'cloud-android-demo/**'
      - '.github/workflows/android-cloud-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check runner Android SDK
        run: test -n "$ANDROID_HOME" && command -v sdkmanager
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build harmless debug APK
        run: gradle --no-daemon -p cloud-android-demo :app:assembleDebug
      - name: Upload APK artifact for Samsung download
        uses: actions/upload-artifact@v4
        with:
          name: Android-Cloud-Demo-APK
          path: cloud-android-demo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
